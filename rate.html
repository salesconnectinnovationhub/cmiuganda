<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Service Comments</title>
  <style>
    .rating i {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="text-center">Service Comments</h2>
      
      <!-- Comment Form -->
      <form>
        <div class="form-group">
          <label for="userName">Your Name:</label>
          <input type="text" class="form-control" id="userName" placeholder="Enter your name" required>
        </div>
        
        <div class="form-group">
          <label for="userComment">Your Comment:</label>
          <textarea class="form-control" id="userComment" rows="4" placeholder="Enter your comment" required></textarea>
        </div>

        <!-- Star Rating -->
        <div class="form-group">
          <label for="userRating">Your Rating:</label>
          <div class="rating">
            <i class="fas fa-star" data-rating="1"></i>
            <i class="fas fa-star" data-rating="2"></i>
            <i class="fas fa-star" data-rating="3"></i>
            <i class="fas fa-star" data-rating="4"></i>
            <i class="fas fa-star" data-rating="5"></i>
          </div>
          <input type="hidden" name="userRating" id="userRating" value="0">
        </div>
        
        <button type="submit" class="btn btn-primary">Submit Comment</button>
      </form>
    </div>
  </div>
  
  <!-- Display Comments -->
  <div class="mt-4">
    <h3>Recent Comments</h3>
    <!-- Add your backend logic to fetch and display comments here -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">User Name</h5>
        <p class="card-text">This is a sample comment. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        <div class="rating">
          <i class="fas fa-star" data-rating="5"></i>
          <!-- Repeat the star icons based on the user's rating -->
        </div>
      </div>
    </div>
    <!-- Repeat the card structure for each comment -->
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<script>
  // JavaScript for star rating
  $(document).ready(function() {
    $('.rating i').click(function() {
      var rating = $(this).data('rating');
      $('#userRating').val(rating);

      // Highlight the selected stars
      $(this).addClass('text-warning').prevAll().addClass('text-warning');
      $(this).nextAll().removeClass('text-warning');
    });
  });
</script>

<script src="assets/js/cms-public.js" defer></script>
</body>
</html>
