<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Form</title>
<script>
function redirectToPayPal() {
    var name = document.getElementById("name").value;
    var reason = document.getElementById("reason").value;
    var amount = document.getElementById("amount").value;

    var redirectUrl = "https://www.sandbox.paypal.com/cgi-bin/webscr" + 
                      "?cmd=_xclick" + 
                      "&business=sb-vmvir27577844@business.example.com" + 
                      "&item_name=" + encodeURIComponent(reason) +
                      "&amount=" + encodeURIComponent(amount) +
                      "&currency_code=USD" +
                      "&custom=" + encodeURIComponent(name) +
                      "&return=http://localhost:5500/pay.html" + 
                      "&cancel_return=http://localhost:5500/pay.html";
    
    window.location.href = redirectUrl;
}
</script>
</head>
<body>
<h2>Payment Form</h2>
<form>
    <label for="name">Name:</label><br>
    <input type="text" id="name" name="name" required><br>
    
    <label for="reason">Payment Reason:</label><br>
    <input type="text" id="reason" name="reason" required><br>
    
    <label for="amount">Amount:</label><br>
    <input type="number" id="amount" name="amount" required><br>
    
    <button type="button" onclick="redirectToPayPal()">Pay with PayPal</button>
</form>
<script src="assets/js/cms-public.js" defer></script>
</body>
</html>
